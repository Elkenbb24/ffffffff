<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 3D Solar System Explorer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            overflow: hidden;
            color: white;
        }

        /* Stars background */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Solar system container */
        .solar-system {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 800px;
            height: 800px;
            perspective: 1000px;
        }

        /* Orbit styles */
        .orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            transform: translate(-50%, -50%) rotateX(75deg);
            animation: rotate linear infinite;
        }

        /* Planet styles */
        .planet {
            position: absolute;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .planet:hover {
            transform: translate(-50%, -50%) scale(1.5);
        }

        /* Sun */
        .sun {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, #ffeb3b 0%, #ff9800 50%, #f44336 100%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 60px #ffeb3b, 0 0 120px #ff9800;
            animation: sunRotate 10s linear infinite;
            z-index: 10;
        }

        @keyframes sunRotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Mercury */
        .mercury-orbit {
            width: 160px;
            height: 160px;
            animation-duration: 8s;
        }

        .mercury {
            top: 0;
            left: 50%;
            width: 8px;
            height: 8px;
            background: #8c7853;
        }

        /* Venus */
        .venus-orbit {
            width: 220px;
            height: 220px;
            animation-duration: 15s;
        }

        .venus {
            top: 0;
            left: 50%;
            width: 12px;
            height: 12px;
            background: #ffc649;
        }

        /* Earth */
        .earth-orbit {
            width: 280px;
            height: 280px;
            animation-duration: 24s;
        }

        .earth {
            top: 0;
            left: 50%;
            width: 14px;
            height: 14px;
            background: linear-gradient(45deg, #6b93d6 0%, #4a90e2 50%, #2e7d32 100%);
        }

        /* Mars */
        .mars-orbit {
            width: 340px;
            height: 340px;
            animation-duration: 35s;
        }

        .mars {
            top: 0;
            left: 50%;
            width: 10px;
            height: 10px;
            background: #c1440e;
        }

        /* Jupiter */
        .jupiter-orbit {
            width: 440px;
            height: 440px;
            animation-duration: 60s;
        }

        .jupiter {
            top: 0;
            left: 50%;
            width: 28px;
            height: 28px;
            background: linear-gradient(45deg, #d8ca9d 0%, #fab1a0 50%, #e17055 100%);
        }

        /* Saturn */
        .saturn-orbit {
            width: 540px;
            height: 540px;
            animation-duration: 90s;
        }

        .saturn {
            top: 0;
            left: 50%;
            width: 24px;
            height: 24px;
            background: #fad5a5;
            position: relative;
        }

        .saturn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 40px;
            height: 40px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        /* Uranus */
        .uranus-orbit {
            width: 640px;
            height: 640px;
            animation-duration: 120s;
        }

        .uranus {
            top: 0;
            left: 50%;
            width: 18px;
            height: 18px;
            background: #4fd0e7;
        }

        /* Neptune */
        .neptune-orbit {
            width: 720px;
            height: 720px;
            animation-duration: 150s;
        }

        .neptune {
            top: 0;
            left: 50%;
            width: 16px;
            height: 16px;
            background: #4b70dd;
        }

        @keyframes rotate {
            from { transform: translate(-50%, -50%) rotateX(75deg) rotateZ(0deg); }
            to { transform: translate(-50%, -50%) rotateX(75deg) rotateZ(360deg); }
        }

        /* Controls */
        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
            min-width: 200px;
        }

        .controls h3 {
            margin-bottom: 15px;
            color: #ffeb3b;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .control-group input[type="range"] {
            width: 100%;
            margin-bottom: 5px;
        }

        .control-group input[type="checkbox"] {
            margin-right: 8px;
        }

        /* Info panel */
        .info {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 300px;
            z-index: 100;
        }

        .info h3 {
            color: #ffeb3b;
            margin-bottom: 10px;
        }

        .info p {
            font-size: 12px;
            line-height: 1.4;
            margin-bottom: 8px;
        }

        /* Planet info */
        .planet-info {
            position: fixed;
            top: 50%;
            left: 20px;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 100;
            max-width: 250px;
        }

        .planet-info h4 {
            color: #ffeb3b;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .planet-info p {
            font-size: 12px;
            margin-bottom: 5px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .solar-system {
                width: 350px;
                height: 350px;
            }
            
            .controls, .info {
                position: fixed;
                left: 10px;
                right: 10px;
                width: auto;
            }
            
            .info {
                bottom: 10px;
            }
            
            .controls {
                top: 10px;
            }
            
            .planet-info {
                left: 10px;
                right: 10px;
                width: auto;
                max-width: none;
            }
        }

        /* Title */
        .title {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 100;
            color: #ffeb3b;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 235, 59, 0.5);
        }
    </style>
</head>
<body>
    <!-- Title -->
    <div class="title">🚀 3D Solar System Explorer</div>

    <!-- Stars background -->
    <div class="stars" id="stars"></div>

    <!-- Solar System -->
    <div class="solar-system" id="solarSystem">
        <!-- Sun -->
        <div class="sun" title="The Sun"></div>

        <!-- Mercury -->
        <div class="orbit mercury-orbit">
            <div class="planet mercury" data-planet="mercury" title="Mercury"></div>
        </div>

        <!-- Venus -->
        <div class="orbit venus-orbit">
            <div class="planet venus" data-planet="venus" title="Venus"></div>
        </div>

        <!-- Earth -->
        <div class="orbit earth-orbit">
            <div class="planet earth" data-planet="earth" title="Earth"></div>
        </div>

        <!-- Mars -->
        <div class="orbit mars-orbit">
            <div class="planet mars" data-planet="mars" title="Mars"></div>
        </div>

        <!-- Jupiter -->
        <div class="orbit jupiter-orbit">
            <div class="planet jupiter" data-planet="jupiter" title="Jupiter"></div>
        </div>

        <!-- Saturn -->
        <div class="orbit saturn-orbit">
            <div class="planet saturn" data-planet="saturn" title="Saturn"></div>
        </div>

        <!-- Uranus -->
        <div class="orbit uranus-orbit">
            <div class="planet uranus" data-planet="uranus" title="Uranus"></div>
        </div>

        <!-- Neptune -->
        <div class="orbit neptune-orbit">
            <div class="planet neptune" data-planet="neptune" title="Neptune"></div>
        </div>
    </div>

    <!-- Controls -->
    <div class="controls">
        <h3>🎮 Controls</h3>
        <div class="control-group">
            <label for="speed">Animation Speed:</label>
            <input type="range" id="speed" min="0.1" max="5" value="1" step="0.1">
            <span id="speedValue">1.0x</span>
        </div>
        <div class="control-group">
            <label>
                <input type="checkbox" id="showOrbits" checked>
                Show Orbital Paths
            </label>
        </div>
        <div class="control-group">
            <label>
                <input type="checkbox" id="showStars" checked>
                Show Stars
            </label>
        </div>
    </div>

    <!-- Info Panel -->
    <div class="info">
        <h3>🌟 How to Use</h3>
        <p><strong>🖱️ Hover</strong> over planets for details</p>
        <p><strong>⚡ Speed</strong> control to see orbits clearly</p>
        <p><strong>👁️ Toggle</strong> orbital paths and stars</p>
        <p><strong>🌍 Educational</strong> space exploration!</p>
    </div>

    <!-- Planet Info (shows on hover) -->
    <div class="planet-info" id="planetInfo" style="display: none;">
        <h4 id="planetName">Planet Name</h4>
        <div id="planetDetails"></div>
    </div>

    <script>
        // Planet data
        const planetData = {
            mercury: {
                name: "Mercury ☿",
                details: `
                    <p><strong>Distance:</strong> 58 million km from Sun</p>
                    <p><strong>Orbital Period:</strong> 88 Earth days</p>
                    <p><strong>Diameter:</strong> 4,879 km</p>
                    <p>The smallest planet and closest to the Sun. No atmosphere, extreme temperature variations.</p>
                `
            },
            venus: {
                name: "Venus ♀",
                details: `
                    <p><strong>Distance:</strong> 108 million km from Sun</p>
                    <p><strong>Orbital Period:</strong> 225 Earth days</p>
                    <p><strong>Diameter:</strong> 12,104 km</p>
                    <p>Hottest planet with thick, toxic atmosphere. Rotates backwards!</p>
                `
            },
            earth: {
                name: "Earth ♁",
                details: `
                    <p><strong>Distance:</strong> 150 million km from Sun</p>
                    <p><strong>Orbital Period:</strong> 365.25 days</p>
                    <p><strong>Diameter:</strong> 12,756 km</p>
                    <p>Our home planet! Only known planet with life. 71% covered by water.</p>
                `
            },
            mars: {
                name: "Mars ♂",
                details: `
                    <p><strong>Distance:</strong> 228 million km from Sun</p>
                    <p><strong>Orbital Period:</strong> 687 Earth days</p>
                    <p><strong>Diameter:</strong> 6,792 km</p>
                    <p>The Red Planet with polar ice caps and the largest volcano in our solar system.</p>
                `
            },
            jupiter: {
                name: "Jupiter ♃",
                details: `
                    <p><strong>Distance:</strong> 778 million km from Sun</p>
                    <p><strong>Orbital Period:</strong> 12 Earth years</p>
                    <p><strong>Diameter:</strong> 142,984 km</p>
                    <p>Largest planet! Gas giant with the Great Red Spot storm and 79+ moons.</p>
                `
            },
            saturn: {
                name: "Saturn ♄",
                details: `
                    <p><strong>Distance:</strong> 1.4 billion km from Sun</p>
                    <p><strong>Orbital Period:</strong> 29 Earth years</p>
                    <p><strong>Diameter:</strong> 120,536 km</p>
                    <p>Famous for its spectacular ring system! Has 82+ moons including Titan.</p>
                `
            },
            uranus: {
                name: "Uranus ♅",
                details: `
                    <p><strong>Distance:</strong> 2.9 billion km from Sun</p>
                    <p><strong>Orbital Period:</strong> 84 Earth years</p>
                    <p><strong>Diameter:</strong> 51,118 km</p>
                    <p>Ice giant that rotates on its side! Has faint rings and 27 moons.</p>
                `
            },
            neptune: {
                name: "Neptune ♆",
                details: `
                    <p><strong>Distance:</strong> 4.5 billion km from Sun</p>
                    <p><strong>Orbital Period:</strong> 165 Earth years</p>
                    <p><strong>Diameter:</strong> 49,528 km</p>
                    <p>Windiest planet with speeds up to 2,100 km/h! Deep blue color from methane.</p>
                `
            }
        };

        // Create stars
        function createStars() {
            const starsContainer = document.getElementById('stars');
            const numStars = 150;

            for (let i = 0; i < numStars; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                
                const size = Math.random() * 2 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.animationDuration = (Math.random() * 3 + 2) + 's';
                
                starsContainer.appendChild(star);
            }
        }

        // Setup controls
        function setupControls() {
            const speedSlider = document.getElementById('speed');
            const speedValue = document.getElementById('speedValue');
            const showOrbitsCheckbox = document.getElementById('showOrbits');
            const showStarsCheckbox = document.getElementById('showStars');
            const stars = document.getElementById('stars');

            // Speed control
            speedSlider.addEventListener('input', (e) => {
                const speed = parseFloat(e.target.value);
                speedValue.textContent = speed.toFixed(1) + 'x';
                
                // Adjust animation speed for all orbits
                const orbits = document.querySelectorAll('.orbit');
                orbits.forEach(orbit => {
                    const originalDuration = orbit.dataset.originalDuration || 
                        parseFloat(getComputedStyle(orbit).animationDuration);
                    
                    if (!orbit.dataset.originalDuration) {
                        orbit.dataset.originalDuration = originalDuration;
                    }
                    
                    orbit.style.animationDuration = (originalDuration / speed) + 's';
                });
                
                // Adjust sun rotation
                const sun = document.querySelector('.sun');
                const sunOriginalDuration = sun.dataset.originalDuration || 10;
                if (!sun.dataset.originalDuration) {
                    sun.dataset.originalDuration = sunOriginalDuration;
                }
                sun.style.animationDuration = (sunOriginalDuration / speed) + 's';
            });

            // Orbit visibility
            showOrbitsCheckbox.addEventListener('change', (e) => {
                const orbits = document.querySelectorAll('.orbit');
                orbits.forEach(orbit => {
                    orbit.style.borderColor = e.target.checked ? 
                        'rgba(255, 255, 255, 0.1)' : 'transparent';
                });
            });

            // Stars visibility
            showStarsCheckbox.addEventListener('change', (e) => {
                stars.style.display = e.target.checked ? 'block' : 'none';
            });
        }

        // Setup planet hover effects
        function setupPlanetHovers() {
            const planets = document.querySelectorAll('.planet');
            const planetInfo = document.getElementById('planetInfo');
            const planetName = document.getElementById('planetName');
            const planetDetails = document.getElementById('planetDetails');

            planets.forEach(planet => {
                planet.addEventListener('mouseenter', (e) => {
                    const planetType = e.target.dataset.planet;
                    const data = planetData[planetType];
                    
                    if (data) {
                        planetName.textContent = data.name;
                        planetDetails.innerHTML = data.details;
                        planetInfo.style.display = 'block';
                    }
                });

                planet.addEventListener('mouseleave', () => {
                    planetInfo.style.display = 'none';
                });
            });
        }

        // Initialize
        function init() {
            createStars();
            setupControls();
            setupPlanetHovers();
            
            console.log('🚀 3D Solar System Explorer loaded successfully!');
            console.log('🌟 Hover over planets to learn more about them');
        }

        // Start when page loads
        window.addEventListener('load', init);

        // Handle window resize
        window.addEventListener('resize', () => {
            // Recalculate responsive elements if needed
            const solarSystem = document.getElementById('solarSystem');
            if (window.innerWidth <= 768) {
                solarSystem.style.width = '350px';
                solarSystem.style.height = '350px';
            } else {
                solarSystem.style.width = '800px';
                solarSystem.style.height = '800px';
            }
        });
    </script>
</body>
</html>
